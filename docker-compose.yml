services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: pm_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: pm_ai_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pm_ai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Node.js & Express Backend Service with Socket.io & AI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pm_backend_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword123@postgres:5432/pm_ai_db
      JWT_SECRET: vku_graduation_thesis_secret_key_2026
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      # AI API keys can be passed here or left blank for Built-in Smart Local AI Engine
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "5000:5000"

  # 3. React Frontend Service (Production Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm_frontend_app
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
    driver: local
